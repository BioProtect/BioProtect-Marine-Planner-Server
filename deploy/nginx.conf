# nginx site for BioProtect: the built client, the API and the tiles on one origin.
# The client finds the API at /server/ and the tiles at /tiles/ on whatever host serves it.
# Replace example.org, then add HTTPS (e.g. certbot --nginx).
server {
    listen 80;
    server_name example.org;
    client_max_body_size 500M;   # rasters/shapefiles; nginx default is 1M

    # built client (frontend `pnpm run build`, copied here)
    root /opt/bioprotect-client;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # never cache the entry page: it names the current hashed bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed assets never change under the same name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API and WebSockets (Tornado, server_port in .env.local)
    location /server/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # the app allows queries up to 120 s; nginx's default 60 s would 504 first
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Martin. The trailing slash strips /tiles; base_path: /tiles in
    # tileserver/config.yaml puts it back into the TileJSON URLs.
    location /tiles/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
