[pytest]
testpaths = tests
pythonpath = .
# Fast set by default; `pytest -m slow` for Prioritizr/R runs and large imports.
# no:anyio - tests use pytest-asyncio; anyio's auto-loaded plugin only adds a
# pytest 9 deprecation warning.
addopts = -m "not slow" -p no:anyio
# geopandas 1.0.0 imports shapely.geos; fixed in geopandas 1.0.1.
filterwarnings =
    ignore:The 'shapely.geos' module is deprecated:DeprecationWarning
# passlib imports crypt, removed in Python 3.13 - a real upgrade blocker, not a test issue.
    ignore:'crypt' is deprecated:DeprecationWarning
markers =
    slow: Prioritizr/R runs and large imports, left out of the default run
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
