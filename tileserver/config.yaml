# Martin tile server. Only the tile functions are served (auto_publish
# off), so no table is reachable by name. The functions live in db/functions/
# and are deployed by `python db/migrate.py deploy`; no Martin restart needed
# when features or grids are added.
#   grid_tiles  - planning grids
#   layer_tiles - features and activities
#   wdpa_tiles  - WDPA reference layer
#   reference_tiles - user reference layers (?layer=<reference_layers.id>)
# Run: martin -c tileserver/config.yaml   (DATABASE_URL overrides the default)
listen_addresses: "0.0.0.0:3000"
# Serves at /<function>/{z}/{x}/{y}; nginx maps /tiles/ onto it
# (proxy_pass http://127.0.0.1:3000/; - the trailing slash strips /tiles).
# No route_prefix: neither 0.15 nor prod's 0.19.3 honours it.
# base_path IS needed (0.19.3 honours it): it puts /tiles into the tile URLs
# of the TileJSON the frontend loads grids and features from. Without it the
# browser asks nginx for /layer_tiles/... and gets the app's HTML back
# ("MapError: Unimplemented type: 4"). Dev's 0.15 ignores it.
base_path: /tiles
web_ui: disable

postgres:
  connection_string: '${DATABASE_URL:postgres://postgres:postgres@localhost/bioprotect}'
  auto_publish: false
  default_srid: 4326
  functions:
    grid_tiles:
      schema: bioprotect
      function: grid_tiles
    layer_tiles:
      schema: bioprotect
      function: layer_tiles
    wdpa_tiles:
      schema: bioprotect
      function: wdpa_tiles
    reference_tiles:
      schema: bioprotect
      function: reference_tiles
